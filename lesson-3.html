<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Программы для рабочих профессий</title><style>:root{--navy:#00003a;--green:#16a000;--red:#ff0027;--blue:#2f89dd;--paper:#f7f8fc;--line:#dfe3ee;--ink:#17172d;--yellow:#fff2c7}*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:transparent;color:var(--ink);font-family:Arial,sans-serif;font-size:16px}.app{position:relative;width:100%;height:min(600px,100dvh);min-height:420px;max-height:600px;background:#fff;border:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}.top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;gap:16px;align-items:center}.brand{font-weight:800}.company{font-size:13px;opacity:.8}.meter{margin-left:auto;min-width:150px}.meter-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.bar{height:7px;background:#ffffff35;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#b2e084;width:0;transition:.3s}.step{padding:10px 18px;background:#f2f4fc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.step strong{color:var(--navy)}.step span{font-size:13px;color:#5e6372}.body{padding:16px 18px;overflow:auto}.intro{margin:0 0 12px;line-height:1.4}.case{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:14px;background:#fff}.case-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.pill{font-size:12px;background:#e9f3ff;color:#145b9f;padding:4px 8px;border-radius:20px}.context{margin:0 0 12px;color:#4d5161;line-height:1.35}.question{font-weight:700;margin-bottom:9px}.options{display:grid;gap:7px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:7px;padding:10px 12px;cursor:pointer;font-size:14px}.option:hover,.option:focus{border-color:var(--blue);outline:none}.option.selected{border-color:var(--blue);background:#edf6ff}.option.correct{border-color:var(--green);background:#e8f6e5}.option.wrong{border-color:var(--red);background:#faeaf0}.feedback{min-height:42px;margin-top:10px;padding:9px 11px;border-radius:7px;background:var(--paper);font-size:13px;line-height:1.35}.feedback.ok{background:#e8f6e5;color:#116d04}.feedback.bad{background:#faeaf0;color:#a3001a}.foot{padding:10px 28px 10px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#eef0f7;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}.count{margin-left:auto;font-size:13px;color:#5e6372}.done{text-align:center;padding:20px}.done h2{color:var(--green);margin:0 0 8px}.passport{margin:14px auto 0;max-width:480px;background:var(--paper);padding:12px;border-radius:8px;text-align:left}.passport-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}.resize-handle{position:absolute;right:2px;bottom:2px;width:22px;height:22px;border:0;background:transparent;cursor:ns-resize;touch-action:none}.resize-handle:before{content:"";position:absolute;right:3px;bottom:3px;width:11px;height:11px;border-right:3px solid #7d8497;border-bottom:3px solid #7d8497}.resize-handle:focus{outline:2px solid var(--blue);outline-offset:-2px}@media(max-width:620px){.app{height:min(600px,100dvh)}.company{display:none}.meter{min-width:110px}.top,.step,.body,.foot{padding-left:12px;padding-right:12px}.step{display:block}.case-head{display:block}.pill{display:inline-block;margin-top:5px}}</style></head><body><main class="app"><header class="top"><div><div class="brand">ООО «Вектор»</div><div class="company">Паспорт системы обучения</div></div><div class="meter"><div class="meter-row"><span>Готовность</span><strong id="pct">0%</strong></div><div class="bar"><i id="bar"></i></div></div></header><div class="step"><strong id="title"></strong><span>Раздел паспорта: <b id="stepName"></b></span></div><section class="body"><p class="intro" id="instruction"></p><div id="stage"></div></section><footer class="foot"><button class="btn secondary" id="restart" style="display:none">Пройти еще раз</button><button class="btn primary" id="next" disabled>Следующая ситуация</button><span class="count" id="count"></span></footer><button class="resize-handle" id="resizeHandle" aria-label="Изменить высоту тренажера" title="Потяните, чтобы изменить высоту"></button></main><script>window.LESSON={"id":3,"title":"Программы для рабочих профессий","step":"Программы Б и В","instruction":"Свяжите риск с практическим навыком. Паспорт проверит, учит ли программа безопасному действию.","questions":[{"person":"Водитель погрузчика","context":"Риск: наезд на работника в слепой зоне.","field":"Какую практику включить?","options":["Учебный маршрут с контролем слепых зон","Лекцию о статистике травм","Чтение инструкции вслух"],"correct":0,"why":"Практика воспроизводит рабочую операцию и позволяет наблюдать действие."},{"person":"Электрогазосварщик","context":"Риск: пожар при огневых работах.","field":"Какой критерий проверки выбрать?","options":["Подготовил место, убрал горючие материалы, проверил средства тушения","Назвал номер инструкции","Прослушал лекцию без пропусков"],"correct":0,"why":"Критерий описывает наблюдаемые действия до начала работы."},{"person":"Кладовщик","context":"Риск: падение груза со стеллажа.","field":"Как сформулировать результат обучения?","options":["Безопасно осматривает стеллаж и размещает груз","Знает требования охраны труда","Понимает ответственность"],"correct":0,"why":"Результат должен описывать действие, которое можно проверить."}]};</script><script>const lesson=window.LESSON;const KEY='vektor_ot_passport_v2';let memory={};const safeGet=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return memory}};const safeSet=value=>{memory=value;try{localStorage.setItem(KEY,JSON.stringify(value))}catch(e){}};let state=safeGet();state.lessons=state.lessons||{};let idx=0;let answers=[];const $=s=>document.querySelector(s);function progress(){const complete=Object.values(state.lessons).filter(x=>x===true).length;$('#pct').textContent=Math.round(complete/8*100)+'%';$('#bar').style.width=(complete/8*100)+'%'}function render(){progress();const q=lesson.questions[idx];$('#stage').innerHTML='<div class="case"><div class="case-head"><strong>'+q.person+'</strong><span class="pill">Ситуация '+(idx+1)+' из '+lesson.questions.length+'</span></div><p class="context">'+q.context+'</p><div class="question">'+q.field+'</div><div class="options">'+q.options.map((o,i)=>'<button type="button" class="option" data-i="'+i+'">'+o+'</button>').join('')+'</div><div class="feedback">Выберите решение. После ответа кнопка перехода станет активной.</div></div>';const next=$('#next');next.disabled=true;next.setAttribute('aria-disabled','true');next.textContent=idx===lesson.questions.length-1?'Завершить раздел':'Следующая ситуация';document.querySelector('.options').addEventListener('click',e=>{const b=e.target.closest('.option');if(b)choose(Number(b.dataset.i))});$('#count').textContent=(idx+1)+' / '+lesson.questions.length}function choose(i){if(answers[idx]!==undefined)return;const q=lesson.questions[idx];answers[idx]=i;document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});const ok=i===q.correct;const f=$('.feedback');f.className='feedback '+(ok?'ok':'bad');f.textContent=(ok?'Верно. ':'Ответ неверный, но можно перейти дальше. ')+q.why;const next=$('#next');next.disabled=false;next.removeAttribute('disabled');next.setAttribute('aria-disabled','false');next.focus()}function next(){if(answers[idx]===undefined)return;if(idx<lesson.questions.length-1){idx++;render()}else finish()}function finish(){const passed=answers.every((a,i)=>a===lesson.questions[i].correct);state=safeGet();state.lessons=state.lessons||{};state.lessons[String(lesson.id)]=passed;state['lesson'+lesson.id]={lessonId:lesson.id,answers,updated:new Date().toISOString()};safeSet(state);progress();const complete=Object.values(state.lessons).filter(x=>x===true).length;$('#stage').innerHTML='<div class="done"><h2>'+(passed?'Раздел '+lesson.id+' паспорта готов':'Раздел '+lesson.id+' требует повторной попытки')+'</h2><p>'+(passed?'Решения по теме «'+lesson.step+'» сохранены.':'Вы дошли до конца. Пройдите раздел еще раз и исправьте ошибки.')+'</p><div class="passport"><div class="passport-row"><span>Текущий урок</span><strong>'+lesson.id+' из 8</strong></div><div class="passport-row"><span>Раздел</span><strong>'+lesson.step+'</strong></div><div class="passport-row"><span>Готово этапов</span><strong>'+complete+' из 8</strong></div></div></div>';$('#next').style.display='none';$('#restart').style.display='inline-block';$('#count').textContent=passed?'Сохранено':'Есть ошибки'}function resetLesson(){idx=0;answers=[];$('#next').style.display='inline-block';$('#restart').style.display='none';render()}function setupResize(){const app=$('.app'),handle=$('#resizeHandle');let startY=0,startH=0;const setHeight=h=>{h=Math.max(420,Math.min(600,h));app.style.height=h+'px';try{localStorage.setItem('vektor_ot_height_v2',String(h))}catch(e){};try{parent.postMessage({type:'vektor-passport-resize',height:h},'*')}catch(e){}};let saved=0;try{saved=Number(localStorage.getItem('vektor_ot_height_v2'))}catch(e){};if(saved)setHeight(saved);handle.addEventListener('pointerdown',e=>{startY=e.clientY;startH=app.getBoundingClientRect().height;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(handle.hasPointerCapture(e.pointerId))setHeight(startH+e.clientY-startY)});handle.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setHeight(app.getBoundingClientRect().height+(e.key==='ArrowDown'?20:-20))}})}window.addEventListener('DOMContentLoaded',()=>{$('#title').textContent='Урок '+lesson.id+'. '+lesson.title;$('#stepName').textContent=lesson.step;$('#instruction').textContent=lesson.instruction;$('#next').addEventListener('click',next);$('#restart').addEventListener('click',resetLesson);setupResize();render()});</script></body></html>
